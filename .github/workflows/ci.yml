name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  mariadb-integration:
    name: MariaDB ${{ matrix.mariadb }} integration
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        mariadb: ["10.11", "11.4"]
    services:
      mariadb:
        image: mariadb:${{ matrix.mariadb }}
        env:
          MARIADB_ROOT_PASSWORD: ci-only-password
          MARIADB_DATABASE: content_machine_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env:
      SESSION_SECRET: "c1a0placeholder0for0ci0only0not0a0real0secret0000000000000000cafe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.9.0
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - name: Native integration tests
        run: npm run test:db
        env:
          DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/content_machine_test
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
      - name: Verify native database backup and restore fencing
        run: node scripts/verify-db-recovery.mjs '${{ job.services.mariadb.id }}'
        env:
          DATABASE_URL: mysql://root:ci-only-password@127.0.0.1:3306/content_machine_test
          ALLOW_DESTRUCTIVE_TEST_DB: "1"
      - name: Build standalone output
        run: npm run build
      - name: Package isolated Hostinger artifact
        run: |
          node scripts/package-hostinger.mjs "$RUNNER_TEMP/content-machine-hostinger"
          node scripts/validate-hostinger-artifact.mjs "$RUNNER_TEMP/content-machine-hostinger"

  windows-runtime:
    name: Windows clean-install runtime checks
    runs-on: windows-latest
    timeout-minutes: 25
    env:
      SESSION_SECRET: "c1a0placeholder0for0ci0only0not0a0real0secret0000000000000000cafe"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.9.0
          cache: npm
      - name: Pin npm 11
        run: npm install --global npm@11.17.0
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:worker
      - run: npm run build
